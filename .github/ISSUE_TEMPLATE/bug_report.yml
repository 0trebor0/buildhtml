name: Bug report
description: Rendered output, an API, or a compiled runtime behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security problems — see [SECURITY.md](https://github.com/0trebor0/buildhtml/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A short script that builds a document and renders it. Smaller is better.
      render: javascript
      placeholder: |
        const { page } = require('@trebor/buildhtml');
        const doc = page('Repro');
        doc.h1('...');
        console.log(doc.render());
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: The rendered HTML, compiled script, or error and stack trace.
      render: text
  - type: input
    id: version
    attributes:
      label: buildhtml version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.11.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: CONFIG.mode
      options: [dev, prod, not sure]
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I ran `doc.validate()` and reviewed the errors and warnings
        - label: I am on the latest version
